# Скопируй в config.yaml и отредактируй под себя:
#   cp config.example.yaml config.yaml

schedule:
  # group (группа), tutor (преподаватель) или auditory (аудитория)
  type: group
  # Имя (или часть имени) — резолвится через справочник eservice.omsu.ru.
  # Можно указать и числовой id напрямую (тот, что в конце ссылки
  # https://eservice.omsu.ru/schedule/#/schedule/group/10983), тогда
  # обращение к справочнику не делается.
  query: "МИБ-401-О-02"

# Ниже — только для schedule.type: group.

# Подгруппа для лабораторных, если группа делится на /1 и /2
subgroup: "1"

# Некоторые пары (иностранный язык, физкультура) в расписании группы
# показаны сразу во всех вариантах — по одному на каждого преподавателя/
# секцию, которую могут выбрать разные студенты потока. Здесь нужно один
# раз сказать, у кого занимаешься ты. Ключ — название дисциплины БЕЗ вида
# занятия (без "Лек"/"Лаб"/"Прак" в конце), значение — часть ФИО
# преподавателя (можно только фамилию, поиск без учёта регистра).
#
# Пары, для которых вариант не указан, в календарь НЕ попадут — при каждом
# запуске скрапер выведет список того, что ещё нужно донастроить.
teacher_overrides: {}
# Пример:
# teacher_overrides:
#   "Иностранный язык": "Вихрова"
#   "Прикладная физическая культура и спорт (элективная дисциплина)": "Урамаев"

# Название календаря в Google Calendar. Если не задать — возьмётся
# автоматически по имени сущности (например "ОмГУ: МИБ-401-О-02").
# calendar_name: "ОмГУ Расписание"

# Часовой пояс Омска (UTC+6, без перехода на летнее время)
timezone: "Asia/Omsk"

# true — синхронизировать только пары начиная с сегодняшнего дня
# (прошедшие пары в календаре не трогаются и не создаются заново)
sync_from_today: true

# За сколько минут до начала пары показывать напоминание.
# Пусто [] — использовать напоминания по умолчанию из настроек календаря.
reminders_minutes: [15]

# Файлы OAuth-авторизации Google (см. README.md, как получить credentials.json)
credentials_file: "credentials.json"
token_file: "token.json"
